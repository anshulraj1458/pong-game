<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        
        <!-- Mode Selection -->
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" data-mode="single">Single Player (vs AI)</button>
            <button class="mode-btn" data-mode="multi">Multiplayer (2 Players)</button>
        </div>

        <div class="scoreboard">
            <div class="score">
                <span id="player1Label">Player 1</span>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <span id="player2Label">Computer</span>
                <p id="computerScore">0</p>
            </div>
        </div>
        <canvas id="pongCanvas"></canvas>
        <div class="instructions">
            <div id="singlePlayerInstructions" class="instruction-set active">
                <p><strong>Single Player Controls:</strong> Use Mouse or Arrow Keys (↑/↓) to move the left paddle</p>
            </div>
            <div id="multiPlayerInstructions" class="instruction-set">
                <p><strong>Player 1 (Left):</strong> Arrow Keys (↑/↓) or W/S</p>
                <p><strong>Player 2 (Right):</strong> Mouse or I/K Keys</p>
            </div>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="resetBtn" class="reset-btn">Reset Score</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
